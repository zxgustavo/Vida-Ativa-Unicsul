<!DOCTYPE html>
<html lang="pt-BR"><head><link rel="icon" type="image/png" href="assets/favicon-vida-ativa.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151718"><title>Entrar • Academia Vida Ativa</title><link rel="stylesheet" href="login.css"></head>
<body><main class="login"><section class="card login-card" aria-labelledby="login-title">
<div class="login-brand"><img class="login-logo" src="assets/logo-vida-ativa.png" width="1024" height="765" alt="Academia Vida Ativa"></div>
<h1 id="login-title">Bem-vindo</h1><p class="subtitle">Entre para acessar sua área de trabalho.</p>
<form id="formLogin"><div class="field"><label for="usuario">Utilizador</label><input id="usuario" name="usuario" autocomplete="username" required></div><div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div><p id="login-feedback" class="feedback" role="alert"></p><button type="submit" class="btn btn-primary">Entrar</button></form>
</section></main><script src="login.js"></script></body></html>
